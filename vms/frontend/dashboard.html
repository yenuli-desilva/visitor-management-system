<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing to Portal | VMS Enterprise</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-body);
    }
    .router-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      max-width: 420px;
      width: 90%;
    }
  </style>
</head>
<body>

<div class="router-box">
  <div style="margin-bottom: 20px;">
    <div class="sidebar-brand-icon" style="width: 56px; height: 56px; margin: 0 auto;">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
    </div>
  </div>
  <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 8px;">Authenticating Session</h2>
  <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px;">Routing you to your authorized operations portal...</p>
  <div style="display: flex; justify-content: center;">
    <span class="spinner" style="width: 32px; height: 32px; border-width: 3px;"></span>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await App.request('auth/me.php');
      const user = res.data?.user;
      if (!user) {
        window.location.replace('login.html');
        return;
      }

      if (user.role === 'admin') {
        window.location.replace('admin-dashboard.html');
      } else {
        window.location.replace('user-dashboard.html');
      }
    } catch (e) {
      window.location.replace('login.html');
    }
  });
</script>

</body>
</html>
